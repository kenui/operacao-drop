<!doctype html><html><head><meta charset="utf-8">

<style>
*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;background:#fff}
.cover{width:340px;height:440px;border-radius:6px 14px 14px 6px;padding:30px 26px;position:relative;overflow:hidden;color:#fff8ef;box-shadow:inset 6px 0 0 rgba(0,0,0,.18)}
.cover .k{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#ffb547}
.cover h1{font-size:38px;line-height:1.05;font-weight:900;margin:14px 0 12px;color:#fff}
.cover p{font-size:15px;line-height:1.4;color:#d9d6ea}
.cover .tag{position:absolute;left:26px;bottom:26px;font-size:12px;font-weight:800;background:#fff8ef;color:#232046;border-radius:999px;padding:6px 12px}
.cover .rings{position:absolute;right:-30px;bottom:40px;width:220px;height:120px}
.c1{background:#232046}
.c2{background:#1f8f6a}.c2 .k{color:#d8f3ea}.c2 p{color:#e6f6ef}
#stack{width:900px;height:720px;background:radial-gradient(circle at 50% 40%,#fff8ef,#f6e7d3);position:relative}
#stack .b{position:absolute;filter:drop-shadow(0 22px 26px rgba(35,32,70,.28))}
#stack .b1{left:120px;top:120px;transform:rotate(-8deg)}
#stack .b2{left:420px;top:150px;transform:rotate(7deg)}
#stack .ribbon{position:absolute;left:50%;transform:translateX(-50%);bottom:46px;background:#ff6b3d;color:#fff;font-weight:900;font-size:26px;padding:12px 28px;border-radius:999px;box-shadow:0 6px 0 #e8531f;letter-spacing:.02em}
.thumb{width:400px;height:400px;background:#fff8ef;display:grid;place-items:center}
.thumb .cover{transform:scale(.8);filter:drop-shadow(0 14px 18px rgba(35,32,70,.25))}
</style></head><body>
<template id="t1"><div class="cover c1"><div class="k">First Hunt Guide · Dogs</div><h1>Chase the light. Then catch something real.</h1><p>The first night, what to do if he ignores it or barks at it, and how to end every session with a toy in his mouth.</p>

<template id="t2"><div class="cover c2"><div class="k">Rainy Day Play Plan · Dogs</div><h1>No walk today? Here's the plan.</h1><p>12 indoor games with things you already have, and a simple week to rotate them.</p>
